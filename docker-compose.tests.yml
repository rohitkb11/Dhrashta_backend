# Isolated test stack: never points at the prototype's persistent volumes.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dhrashta_test
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U test -d dhrashta_test']
      interval: 1s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://test:test@postgres:5432/dhrashta_test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
